[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
ignore = ["DJ001"]

[tool.coverage.run]
branch = true
source = ["apps", "amparo"]
omit = [
  "*/migrations/*",
  "*/admin.py",
  "*/apps.py",
  "*/management/*",
  "amparo/asgi.py",
  "amparo/celery.py",
  "amparo/settings/*",
  "amparo/wsgi.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
